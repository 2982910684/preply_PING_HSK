<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK Vocabulary</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body{background:#f0f1f3;color:#222;margin:0;}

/* Home Page */
.home-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:24px;}
.home-title{font-size:34px;margin-bottom:30px;}
.level-btn{width:240px;padding:18px;font-size:20px;border:none;border-radius:8px;background:#4278eb;color:#fff;cursor:pointer;transition:0.2s;}
.level-btn:hover{background:#2f63d4;}

/* Study Layout 左右分栏 */
.study-wrap{display:none;height:100vh;grid-template-columns:70% 30%;}
.left-panel{display:flex;flex-direction:column;position:relative;overflow:hidden;background:#fff;}
.right-panel{background:#e9ebef;padding:16px;overflow-y:auto;height:100vh;}

/* Top Dropdown Select 右上角选课下拉 */
.top-select{position:absolute;top:16px;right:16px;z-index:10;}
.back-btn{position:absolute;top:16px;left:16px;z-index:10;padding:7px 12px;border:1px solid #d0d2d6;border-radius:6px;background:#fff;color:#333;font-size:14px;cursor:pointer;}
.back-btn:hover{background:#f2f5fb;border-color:#4278eb;color:#4278eb;}
.select-trigger{padding:7px 11px;border:1px solid #d0d2d6;border-radius:6px;background:#fff;cursor:pointer;font-size:15px;}
.dropdown{display:none;position:absolute;top:34px;right:0;background:#fff;border:1px solid #ddd;border-radius:6px;width:170px;box-shadow:0 2px 8px #00000015;}
.dropdown-item{padding:8px 12px;cursor:pointer;font-size:14px;}
.dropdown-item:hover{background:#e8f0ff;}
.top-select:hover .dropdown{display:block;}

/* 词典正文 */
.left-scroll{flex:1;overflow-y:auto;padding:26px 32px 96px;}
.dict{max-width:780px;margin:0 auto;}

/* 词头 */
.word-head{text-align:center;padding-top:18px;}
.phonetic-row{display:flex;justify-content:center;align-items:center;gap:6px;color:#41464f;font-size:19px;letter-spacing:1px;margin-bottom:4px;}
.big-chinese{font-family:"Songti SC","STSong","SimSun",serif;font-size:76px;font-weight:500;line-height:1.15;letter-spacing:3px;color:#1f2328;margin:2px 0 12px;}
.icon-row{display:flex;justify-content:center;align-items:center;gap:32px;color:#9298a2;margin:2px 0 20px;}
.icon-btn{background:none;border:none;padding:2px;cursor:pointer;color:#9298a2;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{color:#4278eb;}

/* 提示条 */
.hint-bar{width:fit-content;margin:0 auto 22px;background:#f4f5f7;border:1px solid #e5e7eb;color:#9298a2;font-size:13px;padding:8px 12px;border-radius:6px;display:flex;align-items:center;gap:8px;}
.hint-close{cursor:pointer;color:#b3b8c0;display:inline-flex;}
.hint-close:hover{color:#6b7280;}

/* 分隔线 */
.hr{height:1px;background:#e6e8eb;margin:16px 0;}

/* 释义 */
.def-line{display:flex;gap:10px;align-items:baseline;font-size:17px;line-height:1.85;color:#23272e;}
.def-main{justify-content:center;text-align:center;}
.pos{color:#4278eb;font-style:italic;font-size:15px;flex:none;}

/* 例句 */
.ex-item{margin-bottom:18px;}
.ex-item:last-child{margin-bottom:0;}
.ex-zh{font-size:17px;line-height:1.7;color:#23272e;display:flex;align-items:center;gap:6px;}
.ex-zh .hl{color:#4278eb;}
.ex-en{font-size:14.5px;line-height:1.6;color:#5b6068;margin-top:2px;}

/* 短语 */
.kv-row{display:flex;gap:18px;font-size:15px;}
.kv-label{flex:none;width:62px;color:#9298a2;font-size:14px;padding-top:2px;}
.kv-body{flex:1;line-height:2;}
.ph-line{display:flex;align-items:center;gap:8px;}
.ph-zh{color:#4278eb;}
.ph-py{color:#5b6068;font-size:14px;}
.ph-en{color:#5b6068;font-size:14px;}

/* 输入框区域 */
.input-wrap{position:relative;margin:26px auto 12px;width:460px;}
#wordInput{width:460px;padding:8px 4px;font-size:19px;border:none;border-bottom:1.5px solid #b9bdc4;border-radius:0;background:transparent;text-align:center;outline:none;}
#wordInput:focus{border-bottom-color:#4278eb;}
.tip-pop{display:none;position:absolute;left:50%;transform:translateX(-50%);top:48px;background:#fff;border:1px solid #ccc;padding:14px;border-radius:6px;width:460px;box-shadow:0 4px 10px rgba(0,0,0,0.12);z-index:9;text-align:left;font-size:14px;line-height:1.7;}

/* 快捷键提示 */
.esc-hint{font-size:13px;color:#9298a2;text-align:center;margin:0 auto;}
#dictBody.stage-learn #escHint{display:none;}

#dictBody.stage-learn{
    display:flex;flex-direction:column;justify-content:center;
    min-height:100%;max-width:780px;margin:0 auto;
}

/* 阶段样式 */
#dictBody.stage-learn #hintBar{display:none;}
#dictBody.stage-practice #wordHead{display:none;}
#dictBody.stage-practice,
#dictBody.stage-test{
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    min-height:100%;max-width:none;width:100%;
}
#dictBody.stage-practice #hrDef,
#dictBody.stage-practice #exBlock,
#dictBody.stage-practice #phraseRow{display:none;}
#dictBody.stage-practice.revealed #hrDef,
#dictBody.stage-practice.revealed #exBlock,
#dictBody.stage-test.revealed #hrDef,
#dictBody.stage-test.revealed #exBlock{display:block;}
#dictBody.stage-practice.revealed #phraseRow,
#dictBody.stage-test.revealed #phraseRow{display:flex;}
#dictBody.stage-test.revealed #defLine{display:flex;}
#wordInput.ok{color:#1e9e4a;}
#wordInput.bad{color:#d83a3a;}
#dictBody.stage-test #wordHead,
#dictBody.stage-test #defLine,
#dictBody.stage-test #hrDef,
#dictBody.stage-test #exBlock,
#dictBody.stage-test #phraseRow{display:none;}

/* 鼠标悬停输入框时展示完整词条信息（与第一阶段一致） */
#dictBody.peek #wordHead{display:block;}
#dictBody.peek #defLine{display:flex;}
#dictBody.peek #hrDef{display:block;}
#dictBody.peek #exBlock{display:block;}
#dictBody.peek #phraseRow{display:flex;}
#dictBody.stage-practice .tip-pop,
#dictBody.stage-test .tip-pop{display:none !important;}

/* 底部控制栏 */
.ctrl-bar{position:absolute;bottom:16px;left:32px;display:flex;gap:10px;align-items:center;}
.progress-text{font-size:14px;color:#666;margin-right:10px;}
.ctrl-btn{padding:7px 12px;border:none;border-radius:5px;background:#4278eb;color:white;cursor:pointer;font-size:14px;}
.ctrl-btn.gray{background:#9ca0a8;}
.ctrl-btn.green{background:#2fa84f;}

/* 右侧单词列表项 */
.word-list-item{padding:10px 8px;border-bottom:1px solid #ddd;cursor:pointer;font-size:15px;line-height:1.4;}
.word-list-item.active{background:#d7e4f8;}
.word-ch{font-size:16px;display:block;}
.word-py{font-size:14px;color:#666;display:block;}
.word-en{font-size:14px;color:#444;display:block;}
/* 考核模糊：中文、拼音模糊，英文保留 */
.blur-mode .word-ch,
.blur-mode .word-py {
    filter: blur(6px);
}
</style>
</head>
<body>

<!-- 首页 -->
<div class="home-wrap" id="homePage">
    <div class="home-title">HSK 3.0 Vocabulary</div>
    <button class="level-btn" onclick="openLevel(1)">LEVEL 1</button>
    <button class="level-btn" onclick="openLevel(2)">LEVEL 2</button>
    <button class="level-btn" onclick="openLevel(3)">LEVEL 3</button>
</div>

<!-- 学习页面 -->
<div class="study-wrap" id="studyPage">
    <div class="left-panel">
        <button class="back-btn" id="backBtn" onclick="goHome()">← Back</button>
        <div class="top-select">
            <div class="select-trigger" id="lessonTrigger">LEVEL 3 Lesson 1 ▾</div>
            <div class="dropdown" id="lessonDropdown"></div>
        </div>

        <div class="left-scroll">
          <div class="dict" id="dictBody">
            <!-- 词头 -->
            <div class="word-head" id="wordHead">
                <div class="phonetic-row">
                    <span id="pinyinShow"></span>
                    <button class="icon-btn" id="spkTop" title="Play audio"></button>
                </div>
                <div class="big-chinese" id="chineseWord"></div>
            </div>

            <!-- 快捷键提示 -->
            <div class="esc-hint" id="escHint">Press Escape to show word info</div>

            <!-- 默写输入 -->
            <div class="input-wrap" id="inputBox" style="display:none;">
                <input type="text" id="wordInput" placeholder="" autocomplete="off" spellcheck="false">
                <div class="tip-pop" id="popInfo"></div>
            </div>

            <!-- 图标行 -->
            <div class="icon-row" id="iconRow">
                <button class="icon-btn" id="iconCheck" title="Mark as learned"></button>
                <button class="icon-btn" id="iconNote" title="Notes"></button>
                <button class="icon-btn" id="iconStar" title="Add to favourites"></button>
                <button class="icon-btn" id="iconSpk" title="Play audio"></button>
            </div>

            <!-- 输入提示条 -->
            <div class="hint-bar" id="hintBar">
                <span class="icon-btn" id="iconInfo"></span>
                <span id="hintText">Press space to finish dictation</span>
                <span class="hint-close" id="hintClose"></span>
            </div>

            <!-- 释义 -->
            <div class="def-line def-main" id="defLine"><span class="pos" id="posTag"></span><span id="defCn"></span></div>

            <div class="hr" id="hrDef"></div>

            <!-- 例句 -->
            <div id="exBlock">
                <div id="exampleList"></div>
                <div class="hr"></div>
            </div>

            <!-- 短语 -->
            <div class="kv-row" id="phraseRow">
                <div class="kv-label">短语</div>
                <div class="kv-body" id="phraseBody"></div>
            </div>
          </div>
        </div>

        <div class="ctrl-bar">
            <span class="progress-text" id="progressTxt">1 / 24</span>
            <button class="ctrl-btn" id="playBtn">Play Audio</button>
            <button class="ctrl-btn" onclick="nextStage()">Next Stage</button>
            <button class="ctrl-btn green" onclick="prevWord()">Prev</button>
            <button class="ctrl-btn" onclick="nextWord()">Next</button>
        </div>
    </div>
    <div class="right-panel" id="rightListPanel">
        <div id="wordList"></div>
    </div>
</div>

<script>
const wordDataL3L1 = [
    {

// LEVEL 3 Lesson 2
const wordDataL3L2 = [
    {

        ],
        phrases:[["又…又…","yòu…yòu…","both…and…"]],

const lessonDataL3 = {1: wordDataL3L1, 2: wordDataL3L2, 3: wordDataL3L3, 4: wordDataL3L4, 5: wordDataL3L5, 6: wordDataL3L6, 7: wordDataL3L7, 8: wordDataL3L8, 9: wordDataL3L9, 10: wordDataL3L10, 11: wordDataL3L11, 12: wordDataL3L12, 13: wordDataL3L13, 14: wordDataL3L14, 15: wordDataL3L15, 16: wordDataL3L16, 17: wordDataL3L17, 18: wordDataL3L18};

let wordData = wordDataL1L1;

let currentLevel = 1;
let currentLesson = 1;
let currentIndex = 0;
let stage = 1; // 1:Learn  2:Practice  3:Test
const totalStage = 3;
const synth = window.speechSynthesis;

/* ---- 图标 ---- */
const ICON = {
    check:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6L16 9.6"/></svg>',

    star:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
    speaker:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9.2v5.6h3.6L12 19V5l-4.4 4.2H4z"/><path d="M16.4 8.6a4.6 4.6 0 0 1 0 6.8"/></svg>',
    share:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 16.8l4.8-4.8 4 3.1 6.4-7.2"/><path d="M14 7.9h4.4v4.3"/></svg>',

    close:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7l10 10M17 7L7 17"/></svg>'
};

function speak(text){
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "zh-CN";
    synth.speak(utter);
}

function renderLessonDrop(){
    const wrap = document.getElementById('lessonDropdown');
    wrap.innerHTML = "";
    const maxLesson = currentLevel === 3 ? 18 : 15;
    for(let i=1;i<=maxLesson;i++){
        const div = document.createElement('div');
        div.className = "dropdown-item";
        div.innerText = `Lesson ${i}`;
        div.onclick = ()=>{
            loadLesson(currentLevel, i);
        }
        wrap.appendChild(div);
    }
    updateLessonLabel();
}

// 顶部下拉标题显示当前 Level / Lesson
function updateLessonLabel(){
    document.getElementById('lessonTrigger').innerText = `LEVEL ${currentLevel} Lesson ${currentLesson} ▾`;
}

// 切换 Level / Lesson，加载对应词表
function loadLesson(level, lesson){
    currentLevel = level;
    currentLesson = lesson;
    const sets = {1: lessonDataL1, 2: lessonDataL2, 3: lessonDataL3};
    const set = sets[level];
    wordData = (set && (set[lesson] || set[1])) ? (set[lesson] || set[1]) : wordDataL1L1;
    currentIndex = 0;
    stage = 1;
    updateLessonLabel();
    renderWord();
}

function openLevel(lv){
    document.getElementById('homePage').style.display = "none";
    document.getElementById('studyPage').style.display = "grid";
    loadLesson(lv, 1);
    renderLessonDrop();
}

// 返回 LEVEL 选择页
function goHome(){
    document.getElementById('studyPage').style.display = "none";
    document.getElementById('homePage').style.display = "flex";
}

// 右侧列表渲染
function renderWordList(){
    const listWrap = document.getElementById('wordList');
    listWrap.innerHTML = "";
    wordData.forEach((item,idx)=>{
        const div = document.createElement('div');
        div.className = "word-list-item";
        if(idx === currentIndex) div.classList.add('active');
        div.innerHTML = `
            <span class="word-ch">${item.word}</span>
            <span class="word-py">${item.pinyin}</span>
            <span class="word-en">${item.define}</span>
        `;
        div.onclick = ()=>{
            currentIndex = idx;
            renderWord();
            renderWordList();
        }
        listWrap.appendChild(div);
    })
    // 练习/测试阶段：中文、拼音模糊，英文释义保留
    if(stage >= 2){
        document.getElementById('rightListPanel').classList.add('blur-mode');
    }else{
        document.getElementById('rightListPanel').classList.remove('blur-mode');
    }
}

// 例句中高亮目标词
function hiLight(text, word){
    if(!text.includes(word)) return text;
    return text.split(word).join(`<span class="hl">${word}</span>`);
}

function renderWord(){
    const item = wordData[currentIndex];
    document.getElementById('progressTxt').innerText = `${currentIndex+1} / ${wordData.length}`;
    document.getElementById('chineseWord').innerText = item.word;
    document.getElementById('pinyinShow').innerText = item.pinyin;
    document.getElementById('posTag').innerText = item.pos;
    document.getElementById('defCn').innerText = item.define;
    document.getElementById('popInfo').innerText = `${item.word} [${item.pinyin}] ${item.pos} ${item.define} ｜ ${item.examples[0][0]}`;

    // 例句
    const exWrap = document.getElementById('exampleList');
    exWrap.innerHTML = item.examples.map(ex => `
        <div class="ex-item">
            <div class="ex-zh">${hiLight(ex[0], item.word)}<button class="icon-btn spk" data-text="${ex[0]}" title="Play audio">${ICON.speaker}</button></div>
            <div class="ex-en">${ex[1]}</div>
        </div>
    `).join('');

    // 短语
    document.getElementById('phraseBody').innerHTML = item.phrases.map(ph => `
        <div class="ph-line">
            <span class="ph-zh">${ph[0]}</span>
            <span class="ph-py">${ph[1]}</span>
            <button class="icon-btn spk" data-text="${ph[0]}" title="Play audio">${ICON.speaker}</button>
            <span class="ph-en">${ph[2]}</span>
        </div>
    `).join('');

    // 发音按钮绑定
    document.querySelectorAll('.spk').forEach(btn=>{
        btn.onclick = ()=> speak(btn.dataset.text);
    });

    const wordInput = document.getElementById('wordInput');
    wordInput.value = "";
    wordInput.classList.remove('ok','bad');
    document.getElementById('hintText').innerText = "Press space to finish dictation";

    const dict = document.getElementById('dictBody');
    const inputBox = document.getElementById('inputBox');

    const stageCls = ['stage-learn','stage-practice','stage-test'][stage-1];
    dict.className = `dict ${stageCls}`;
    inputBox.style.display = stage === 1 ? "none" : "block";
    if(stage >= 2) wordInput.focus();
    renderWordList();
    ensureActiveVisible();
}

// 当前词在右侧列表中不可见时，自动滚动到可见位置
function ensureActiveVisible(){
    const panel = document.getElementById('rightListPanel');
    const active = panel.querySelector('.word-list-item.active');
    if(!active) return;
    const p = panel.getBoundingClientRect();
    const a = active.getBoundingClientRect();
    if(a.top < p.top || a.bottom > p.bottom){
        const target = panel.scrollTop + (a.top - p.top) - (panel.clientHeight - active.offsetHeight) / 2;
        panel.scrollTo({top: Math.max(0, target), behavior: 'smooth'});
    }
}

};

function nextStage(){
    stage +=1;
    if(stage > totalStage){
        stage = 1;
    }
    renderWord();
}

function prevWord(){
    if(currentIndex >0) currentIndex--;
    else currentIndex = wordData.length-1;
    renderWord();
}
function nextWord(){
    if(currentIndex < wordData.length-1) currentIndex++;
    else currentIndex = 0;
    renderWord();
}

/* 对错音效 */
let audioCtx = null;
function beep(freq, dur, type, when){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.25, t0 + 0.02);
    gain.gain.linearRampToValueAtTime(0, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
}
function playCorrect(){
    beep(880, 0.12, "sine", 0);
    beep(1320, 0.18, "sine", 0.12);
}
function playWrong(){
    beep(220, 0.28, "sawtooth", 0);
}

document.getElementById('wordInput').onkeydown = function(e){
    // 答错后按一次删除键，清空全部内容
    if(e.key === 'Backspace' && this.classList.contains('bad')){
        e.preventDefault();
        this.value = "";
        this.classList.remove('bad');
        document.getElementById('hintText').innerText = "Press space to finish dictation";
        return;
    }
    if(e.key === 'Enter' || e.key === ' '){
        if(e.key === ' '){ e.preventDefault(); }
        // 已判定正确时，继续下一个词
        if(stage >= 2 && this.classList.contains('ok')){
            nextWord();
            return;
        }
        const ans = this.value.trim();
        if(!ans) return;
        const right = wordData[currentIndex].word;
        this.classList.remove('ok','bad');
        if(stage >= 2){
            // 练习/测试阶段：对错只做颜色与音效反馈，并展开释义、例句与短语
            const ok = ans === right;
            this.classList.add(ok ? 'ok' : 'bad');
            document.getElementById('dictBody').classList.add('revealed');
            document.getElementById('hintText').innerText = ok ? "Press space to continue" : "Press Backspace and try again";
            if(ok){ playCorrect(); } else { playWrong(); }
            return;
        }
        if(ans === right){
            alert("✅ Correct!");
            nextWord();
        }else{
            alert(`❌ Wrong! The answer is: ${right}`);
        }
    }
}

// 重新输入时清除对错颜色与提示语
document.getElementById('wordInput').oninput = function(){
    this.classList.remove('ok','bad');
    document.getElementById('hintText').innerText = "Press space to finish dictation";
};

// 按 Escape 显示/隐藏完整词条信息
document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && stage >= 2){
        document.getElementById('dictBody').classList.toggle('peek');
    }
});
